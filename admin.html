<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>MondQuest · Admin</title><link rel="stylesheet" href="panel.css"></head><body><div class="wrap" id="app"></div>
<script src="config.js"></script><script src="js/api.js"></script><script>
const app=$('#app');let D=null,tab='Rewards';
const TABS=[['Rewards','Prizes'],['Cosmetics','Outfits'],['Gadgets','Gadgets'],['Config','Points & rules'],['Combos','Combos'],['Ranks','Ranks'],['Places','Places'],['News','News'],['Players','Players'],['Log','Activity']];
const NEW={Rewards:{id:'',name:'',category:'merch',cost:50,stock:10,active:true},Cosmetics:{id:'',name:'',kind:'accessory',cost:5,rank:1,active:true},Gadgets:{id:'',name:'',cost:5,rank:1,comet:0,meteor:0,nebula:0,void:0,rings:0,active:true},Combos:{id:'',stat:'places',at:5,bonus:10,label:''},Ranks:{rank:'',name:'',earned:0},Places:{id:'',name:'',type:'cafe',posterSize:'A4',address:'',lat:52.51,lng:13.45,spot:'',notes:'',active:true,status:'approved',addedBy:'admin'},News:{id:'',title:'',body:'',image:'',type:'new flyers',active:true}};
const LOCK={Config:['Key','Unit','What it does'],Places:['status','addedBy','updatedAt'],News:['updatedAt']};
function login(msg){app.innerHTML=`<div class="card login"><h1>Admin</h1><p class="sub">MondQuest · Zirkus Mond</p><form id="f"><input id="pin" type="password" placeholder="Admin PIN" autocomplete="off" style="width:100%"><br><br><button style="width:100%">Enter</button></form><p class="hint">${esc(msg||'')}</p></div>`;
 $('#f').onsubmit=async e=>{e.preventDefault();Api.setPin($('#pin').value);try{await load();render()}catch(x){Api.clear();login(x.message)}}}
async function load(){D=await Api.call('adminGet');D.Players={rows:(await Api.call('adminPlayers')).rows};D.Log={rows:(await Api.call('adminLog')).rows.reverse()}}
function render(){app.innerHTML=`<div class="top"><div><h1>Admin panel</h1><p class="sub">Changes reach every player within a minute of saving.</p></div><span><button class="alt" id="rl">Reload</button> <button class="alt" id="out">Sign out</button></span></div>
 <div class="tabs">${TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" data-t="${k}">${l}${k==='Places'&&D.Places.rows.some(r=>r.status==='submitted')?' •':''}${k==='Redemptions'?'':''}</button>`).join('')}</div><div id="body"></div>`;
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});$('#out').onclick=()=>{Api.clear();login()};$('#rl').onclick=async()=>{try{await load();render();toast('Reloaded')}catch(x){toast(x.message,1)}};
 ({Players:players,Log:logView})[tab]?({Players:players,Log:logView})[tab]():editor()}
function editor(){const t=D[tab],h=t.headers,rows=t.rows,lock=LOCK[tab]||[];
 const sub=rows.filter(r=>r.status==='submitted');
 $('#body').innerHTML=`${tab==='Places'&&sub.length?`<div class="card"><h2>Waiting for review (${sub.length})</h2>${sub.map(r=>`<div class="row" style="margin:6px 0"><b style="flex:1">${esc(r.name)} <span class="hint">${esc(r.type)} · ${esc(r.address)} · ${esc(r.addedBy)} · <a style="color:#5AB0FF" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${esc(r.lat)}&mlon=${esc(r.lng)}#map=18/${esc(r.lat)}/${esc(r.lng)}">map</a></span></b><button class="good" data-a="${esc(r.id)}">Approve</button><button class="bad" data-x="${esc(r.id)}">Reject</button></div>`).join('')}</div>`:''}
 <div class="card">${tab==='Cosmetics'||tab==='Gadgets'?'<p class="hint">Costs must be between 3 and 10 Mondinos.</p>':''}${tab==='Config'?'<p class="hint">Change only the Value column. Per-flyer points are decimals (0.2 = 5 flyers for 1 point).</p>':''}${tab==='Rewards'||tab==='Places'||tab==='News'||tab==='Cosmetics'||tab==='Gadgets'?'<p class="hint">Do not delete items players already used: untick “active” instead.</p>':''}
 <div class="grid"><table><tr>${h.map(k=>`<th>${esc(k)}</th>`).join('')}<th></th></tr>${rows.map((r,i)=>`<tr>${h.map(k=>cell(r,i,k,lock.includes(k))).join('')}<td>${NEW[tab]?`<button class="bad" data-del="${i}" style="min-height:34px;padding:2px 8px">✕</button>`:''}</td></tr>`).join('')}</table></div>
 <div class="row" style="margin-top:10px">${NEW[tab]?'<button class="alt" id="add">+ Add row</button>':''}<button id="save">Save ${esc(tab)}</button></div></div>`;
 document.querySelectorAll('[data-c]').forEach(el=>el.onchange=()=>{const[i,k]=el.dataset.c.split('|');rows[i][k]=el.type==='checkbox'?el.checked:(el.type==='number'?Number(el.value):el.value)});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Remove this row?')){rows.splice(+b.dataset.del,1);editor()}});
 $('#add')&&($('#add').onclick=()=>{const n={...NEW[tab]};if('id' in n)n.id=tab.slice(0,2).toLowerCase()+Date.now().toString(36).slice(-4);if(tab==='Ranks')n.rank=rows.length+1;rows.push(n);editor()});
 $('#save').onclick=save;
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>review(b.dataset.a,true));document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>review(b.dataset.x,false))}
function cell(r,i,k,locked){const v=r[k];const id=`data-c="${i}|${k}"`;
 if(locked)return`<td class="hint">${esc(v)}</td>`;
 if(v===true||v===false||k==='active')return`<td><input type="checkbox" ${id} ${v===true||String(v).toUpperCase()==='TRUE'?'checked':''}></td>`;
 return`<td><input ${id} type="${typeof v==='number'?'number':'text'}" step="any" value="${esc(v)}"></td>`}
async function save(){const b=$('#save');b.disabled=true;try{const rows=D[tab].rows.map(r=>{const o={};D[tab].headers.forEach(k=>o[k]=r[k]);return o});
 const x=await Api.call('adminSave',{sheet:tab,rows});toast('Saved '+x.saved+' rows');await load();render()}catch(e){toast(e.message,1)}finally{b.disabled=false}}
async function review(id,approve){try{await Api.call('adminReviewPlace',{id,approve});toast(approve?'Place approved':'Place rejected');await load();render()}catch(e){toast(e.message,1)}}
function players(){const rows=D.Players.rows;$('#body').innerHTML=`<div class="card"><h2>Players (${rows.length})</h2><div class="grid"><table><tr><th>Name</th><th>Code</th><th>Mondinos</th><th>Earned</th><th>Material</th><th>Last seen</th><th>Trust</th><th>Give</th></tr>${rows.map(r=>`<tr><td>${esc(r.Name)}</td><td>${esc(r.Code)}</td><td>${esc(r.Wallet)}</td><td>${esc(r.Earned)}</td><td>${esc(r.Flyers)}/${esc(r.Posters)}/${esc(r.Stickers)}</td><td>${esc(String(r.LastSeen).slice(0,10))}</td>
 <td><select data-tr="${esc(r.Code)}">${['new','trusted','flagged'].map(o=>`<option ${o===r.Trust?'selected':''}>${o}</option>`).join('')}</select></td>
 <td><div class="row" style="flex-wrap:nowrap"><input id="pt-${esc(r.Code)}" type="number" placeholder="± pts" style="width:80px"><input id="nt-${esc(r.Code)}" placeholder="reason" style="width:120px"><button data-g="${esc(r.Code)}" style="min-height:34px">Give</button></div></td></tr>`).join('')}</table></div><p class="hint">Positive points reward, negative points correct. The player sees the note in their activity.</p></div>`;
 document.querySelectorAll('[data-tr]').forEach(s=>s.onchange=async()=>{try{await Api.call('adminSetTrust',{code:s.dataset.tr,trust:s.value});toast('Trust updated')}catch(e){toast(e.message,1)}});
 document.querySelectorAll('[data-g]').forEach(b=>b.onclick=async()=>{const c=b.dataset.g,p=Number($('#pt-'+c).value);if(!p)return toast('Enter points',1);try{await Api.call('adminGrant',{code:c,points:p,note:$('#nt-'+c).value});toast('Queued for the player');$('#pt-'+c).value=''}catch(e){toast(e.message,1)}})}
function logView(){$('#body').innerHTML=`<div class="card"><h2>Latest activity</h2><div class="grid"><table><tr><th>When</th><th>Player</th><th>Type</th><th>What</th><th>Pts</th></tr>${D.Log.rows.map(r=>`<tr><td>${esc(String(r.At||r.Received).slice(0,16).replace('T',' '))}</td><td>${esc(r.PlayerName)}</td><td>${esc(r.Type)}</td><td>${esc(r.Label)}</td><td>${esc(r.Amount)}</td></tr>`).join('')}</table></div></div>`}
Api.pin()?load().then(render).catch(()=>login()):login();
</script></body></html>
