<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>MondQuest · Staff</title><link rel="stylesheet" href="panel.css"></head><body><div class="wrap" id="app"></div>
<script src="config.js"></script><script src="js/api.js"></script><script>
const app=$('#app');let cur=null;
function login(msg){app.innerHTML=`<div class="card login"><h1>Staff</h1><p class="sub">MondQuest · Zirkus Mond</p><form id="f"><input id="pin" type="password" inputmode="numeric" placeholder="Staff PIN" autocomplete="off" style="width:100%"><br><br><button style="width:100%">Enter</button></form><p class="hint">${esc(msg||'')}</p></div>`;
 $('#f').onsubmit=async e=>{e.preventDefault();Api.setPin($('#pin').value);try{await Api.call('staffRedemptions');main()}catch(x){Api.clear();login(x.message)}}}
async function main(){
 app.innerHTML=`<div class="top"><div><h1>Staff desk</h1><p class="sub">Look up a player, restock material, hand over prizes.</p></div><button class="alt" id="out">Sign out</button></div>
 <div class="card"><h2>Find player</h2><form class="row" id="lf"><input id="code" placeholder="Player code, e.g. MQ-ABC123" autocapitalize="characters" autocomplete="off"><button>Look up</button></form><div id="pl"></div></div>
 <div class="card"><h2>Prizes waiting <button class="alt" id="rf" style="float:right;min-height:34px;padding:2px 10px">Refresh</button></h2><div id="pend"></div></div>`;
 $('#out').onclick=()=>{Api.clear();login()};$('#rf').onclick=loadPending;
 $('#lf').onsubmit=async e=>{e.preventDefault();lookup($('#code').value.trim().toUpperCase())};
 loadPending();
}
async function loadPending(){try{const r=await Api.call('staffRedemptions');$('#pend').innerHTML=r.rows.length?`<div class="grid"><table><tr><th>Player</th><th>Prize</th><th>Cost</th><th>Asked</th><th></th></tr>${r.rows.map(x=>`<tr><td>${esc(x.PlayerName)}<br><span class="hint">${esc(x.PlayerCode)}</span></td><td>${esc(x.Item)}</td><td>${esc(x.Cost)}</td><td>${esc(String(x.RequestedAt).slice(0,16).replace('T',' '))}</td><td><button class="good" data-d="${esc(x.ReqId)}">Delivered</button> <button class="bad" data-r="${esc(x.ReqId)}">Reject</button></td></tr>`).join('')}</table></div>`:'<p class="hint">Nothing waiting.</p>';
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>handle(b.dataset.d,'delivered'));document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>handle(b.dataset.r,'rejected'))}catch(x){toast(x.message,1)}}
async function handle(id,status){if(status==='rejected'&&!confirm('Reject this request? The player gets the Mondinos back.'))return;try{await Api.call('staffHandle',{id,status});toast(status==='delivered'?'Marked as delivered':'Rejected');loadPending();if(cur)lookup(cur)}catch(x){toast(x.message,1)}}
async function lookup(code){cur=code;const el=$('#pl');el.innerHTML='…';try{const r=await Api.call('staffLookup',{code});
 if(!r.found){el.innerHTML='<p class="hint">No player with that code. Ask them to open the game once while online.</p>';return}
 const p=r.player;el.innerHTML=`<h2>${esc(p.name)} <span class="pill ${esc(p.trust)}">${esc(p.trust)}</span></h2><span class="stat">Mondinos <b>${esc(p.wallet)}</b></span><span class="stat">Earned <b>${esc(p.earned)}</b></span><span class="stat">Flyers <b>${esc(p.flyers)}</b></span><span class="stat">Posters <b>${esc(p.posters)}</b></span><span class="stat">Stickers <b>${esc(p.stickers)}</b></span><p class="hint">Last seen ${esc(String(p.lastSeen).slice(0,16).replace('T',' '))}. Numbers update when the player's phone syncs.</p>
 <h2>Give material</h2><div class="row"><label>Flyers <input id="gf" type="number" min="0" value="30" style="width:90px"></label><label>Posters <input id="gp" type="number" min="0" value="6" style="width:90px"></label><label>Stickers <input id="gs" type="number" min="0" value="12" style="width:90px"></label><button id="gb">Send to player</button></div><p class="hint">It lands in the player's bag the next time the game is open (within about 90 seconds).</p>
 ${r.pending.length?`<h2>Their pending prizes</h2>${r.pending.map(x=>`<div class="row"><b style="flex:1">${esc(x.Item)} · ${esc(x.Cost)}</b><button class="good" data-d="${esc(x.ReqId)}">Delivered</button><button class="bad" data-r="${esc(x.ReqId)}">Reject</button></div>`).join('')}`:''}`;
 $('#gb').onclick=async()=>{try{await Api.call('staffGrant',{code,flyers:$('#gf').value,posters:$('#gp').value,stickers:$('#gs').value});toast('Material sent')}catch(x){toast(x.message,1)}};
 el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>handle(b.dataset.d,'delivered'));el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>handle(b.dataset.r,'rejected'));
}catch(x){el.innerHTML='';toast(x.message,1)}}
Api.pin()?Api.call('staffRedemptions').then(main).catch(()=>login()):login();
</script></body></html>
